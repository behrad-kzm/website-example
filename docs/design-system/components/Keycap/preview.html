<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>Keycap</title></head>
<body>
<div class="cz-stage cz-stack">
  <div class="cz-row">
    <span class="cz-keys"><kbd class="cz-kbd">⌘</kbd><kbd class="cz-kbd">K</kbd></span>
    <span class="cz-keys"><kbd class="cz-kbd">⌥</kbd><kbd class="cz-kbd">Space</kbd></span>
    <span class="cz-keys"><kbd class="cz-kbd">↵</kbd></span>
    <span class="cz-keys"><kbd class="cz-kbd">esc</kbd></span>
  </div>
  <div class="cz-row">
    <span class="cz-keys"><kbd class="cz-kbd cz-kbd--lg">⌃</kbd><kbd class="cz-kbd cz-kbd--lg">⌥</kbd><kbd class="cz-kbd cz-kbd--lg">→</kbd></span>
  </div>
</div>
<script src="../glass.js"></script>
</body>
</html>
