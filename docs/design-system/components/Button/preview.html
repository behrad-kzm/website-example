<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>Button</title></head>
<body>
<div class="cz-stage cz-stack">
  <div class="cz-row">
    <button class="cz-btn cz-btn--primary cz-glass cz-glass--prominent cz-glass--interactive" type="button">Download for Mac</button>
    <button class="cz-btn cz-glass cz-glass--interactive" type="button">Watch the demo</button>
    <button class="cz-btn cz-glass cz-glass--tint cz-glass--interactive" type="button">Try Pro</button>
    <button class="cz-btn cz-btn--plain" type="button">Pricing</button>
  </div>
  <div class="cz-row">
    <button class="cz-btn cz-btn--sm cz-btn--primary cz-glass cz-glass--prominent cz-glass--interactive" type="button">Install Extension</button>
    <button class="cz-btn cz-btn--sm cz-glass cz-glass--clear cz-glass--interactive" type="button">Copy command</button>
    <button class="cz-btn cz-btn--icon cz-glass cz-glass--interactive" type="button" aria-label="Search"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" aria-hidden="true"><circle cx="8" cy="8" r="5.5" stroke="currentColor" stroke-width="1.6"/><path d="M12 12l4 4" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg></button>
    <button class="cz-btn cz-btn--sm cz-glass" type="button" disabled>Installed</button>
  </div>
</div>
<script src="../glass.js"></script>
</body>
</html>
