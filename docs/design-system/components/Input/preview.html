<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>Input</title><style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-3)}</style></head>
<body>
<div class="cz-stage grid">
  <div class="cz-field"><label for="em">Work email</label><input id="em" class="cz-input cz-glass" type="email" placeholder="you@company.com"><span class="cz-field__hint">We'll send the download link here.</span></div>
  <div class="cz-field cz-field--error"><label for="tm">Team name</label><input id="tm" class="cz-input cz-glass" type="text" value="acme inc!"><span class="cz-field__hint">Use letters, numbers and hyphens only.</span></div>
</div>
<script src="../glass.js"></script>
</body>
</html>
