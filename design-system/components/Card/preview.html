<!-- @dsCard group="Surfaces" height=260 subtitle="Feature card and glowing feature card" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../bundle.css"><title>Card</title>
<style>.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:var(--space-3)}</style></head>
<body>
<div class="grid">
  <article class="cz-card">
    <div class="cz-card__icon" aria-hidden="true"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="3" width="6" height="14" rx="2" fill="currentColor"/><rect x="11" y="3" width="6" height="6" rx="2" fill="currentColor" opacity=".5"/><rect x="11" y="11" width="6" height="6" rx="2" fill="currentColor" opacity=".5"/></svg></div>
    <h3 class="cz-card__title">Window Management</h3>
    <p class="cz-card__body">Snap windows to halves, thirds and corners with a shortcut.</p>
  </article>
  <article class="cz-card cz-card--glow">
    <div class="cz-card__icon" aria-hidden="true" style="color:var(--purple)"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 2l2 6 6 2-6 2-2 6-2-6-6-2 6-2z" fill="currentColor"/></svg></div>
    <h3 class="cz-card__title">AI Commands</h3>
    <p class="cz-card__body">Fix spelling, translate or summarise the selected text in place.</p>
  </article>
</div>
</body>
</html>
